; Copy to config.ini. Comments only on their own lines (no inline comments).
; Secrets can come from the environment instead: FIX_PASSWORD, FIX_BRIDGE_TOKEN.

[fix]
host = 127.0.0.1
port = 9878
sender_comp_id = MT5BRIDGE
target_comp_id = VENUE
begin_string = FIX.4.4
heartbeat = 30
; true = send ResetSeqNumFlag=Y on every logon (common for FX venues).
; false = persist sequence numbers in store_dir (the venue must accept gap fills).
reset_on_logon = true
tls = false
tls_verify = true
username =
password =
; Account (tag 1), used by position requests.
account =
reconnect_delay = 5
store_dir = ./store

[bridge]
listen_host = 127.0.0.1
listen_port = 9100
; dry_run = true: orders are NOT sent to the venue, they are filled locally.
; Market data and position requests still go to the venue (read only).
dry_run = true
; Optional shared secret the EA must send first (InpToken).
auth_token =
; MDUpdateType (tag 265): 0 = full refresh, 1 = incremental.
md_update_type = 0
md_depth = 1

[risk]
allowed_symbols = EURUSD,GBPUSD,USDJPY
; Max order size in units (not lots).
max_qty = 100000
; If this file exists, new orders and replaces are refused. Cancels still work.
kill_file = ./KILL

[symbols]
; MT5 symbol = FIX symbol (tag 55). Symbols listed here are allowed too.
; XAUUSD = XAU/USD
; EURUSD.m = EURUSD
